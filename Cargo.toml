[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
domain-client = { path = "crates/domain-client" }
domain-macros = { path = "crates/domain-macros" }
domain-memory = { path = "crates/domain-memory" }
domain-sqlite = { path = "crates/domain-sqlite" }
domain-server = { path = "crates/domain-server" }
domain-story = { path = "crates/domain-story" }
domain-websocket = { path = "crates/domain-websocket" }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
