name: CI

on:
  push:
    branches: [main]
  pull_request:

# mise.toml pins nightly.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Each benchmark once, with its setup checks, so a bench that breaks fails here.
      - run: cargo test -p bank --benches --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Everything except domain-sqlite, domain-server and domain-websocket builds for the web.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown -p domain -p domain-memory -p domain-client -p domain-story
      - run: cargo check --locked --target wasm32-unknown-unknown -p bank --lib
